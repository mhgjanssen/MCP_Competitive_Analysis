name: Email weekly MCP competitive report

on:
  # Fire shortly after the Cursor cloud agent cron (Fridays 15:00 UTC).
  # Cushion gives the agent time to commit the new report before we email it.
  schedule:
    - cron: "30 15 * * 5"
  # One-off push trigger to deliver the June 5 weekly MCP report email.
  # This block is added temporarily and removed in a follow-up commit.
  push:
    branches:
      - cursor/mcp-competitive-intelligence-report-2384
    paths:
      - ".github/workflows/email-weekly-report.yml"
  workflow_dispatch:
    inputs:
      report_path:
        description: "Optional explicit path to an HTML report to email."
        required: false
        type: string

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send latest weekly report
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.report_path }}" ]; then
            python scripts/send_report_email.py "${{ inputs.report_path }}"
          else
            python scripts/send_report_email.py
          fi
